name: Changelog

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  leak-filter:
    name: Validate public changelog seed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run changelog:check
